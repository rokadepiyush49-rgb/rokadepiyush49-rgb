<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="/" />
<title>Profile preview</title>
<link id="md" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css" />
<style>
  :root { --page: #0d1117; --box: #0d1117; --edge: #30363d; --ink: #e6edf3; }
  :root[data-theme="light"] { --page: #ffffff; --box: #ffffff; --edge: #d0d7de; --ink: #1f2328; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--page); border-bottom: 1px solid var(--edge); }
  .bar button { font: inherit; padding: 4px 10px; border: 1px solid var(--edge); border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; }
  .wrap { max-width: 896px; margin: 24px auto; padding: 0 16px; }
  .wrap.narrow { max-width: 400px; }
  .box { border: 1px solid var(--edge); border-radius: 6px; padding: 24px; background: var(--box); }
  .file { font-size: 12px; margin-bottom: 16px; font-family: ui-monospace, Menlo, monospace; }
  .markdown-body { background: transparent; }
</style>
</head>
<body>
<div class="bar">
  <strong>rokadepiyush49-rgb / README.md</strong>
  <button id="theme">Toggle light/dark</button>
  <button id="width">Toggle mobile width</button>
  <button id="replay">Replay animations</button>
</div>
<div class="wrap" id="wrap">
  <div class="box">
    <div class="file">rokadepiyush49-rgb / README.md</div>
    <article class="markdown-body" id="out">Loading…</article>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  const out = document.getElementById('out');
  async function render() {
    const md = await (await fetch('README.md', { cache: 'no-store' })).text();
    out.innerHTML = marked.parse(md);
    // cache-bust local SVGs so regenerated files show immediately
    const v = Date.now();
    out.querySelectorAll('img').forEach((img) => {
      const src = img.getAttribute('src');
      if (src && src.startsWith('readme/')) img.src = `${src}?v=${v}`;
    });
  }
  render();
  document.getElementById('theme').onclick = () => {
    const root = document.documentElement;
    const light = root.dataset.theme !== 'light';
    root.dataset.theme = light ? 'light' : 'dark';
    document.getElementById('md').href = `https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-${light ? 'light' : 'dark'}.min.css`;
  };
  document.getElementById('width').onclick = () => document.getElementById('wrap').classList.toggle('narrow');
  document.getElementById('replay').onclick = render;
</script>
</body>
</html>
