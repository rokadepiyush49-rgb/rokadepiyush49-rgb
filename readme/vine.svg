    <rect x="30" y="2" width="2" height="12" fill="#6E2400"/>
    <rect x="16" y="16" width="2" height="14" fill="#FC9838"/>
    <rect x="14" y="18" width="2" height="12" fill="#6E2400"/>
  </pattern></defs>
<style>
.sm{shape-rendering:auto}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
@keyframes fA{0%{opacity:1}50%{opacity:0}}
@keyframes fB{0%{opacity:0}50%{opacity:1}}
