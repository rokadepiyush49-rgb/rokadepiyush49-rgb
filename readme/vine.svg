<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 380" width="140" height="380" role="img" aria-label="Mario climbs down a beanstalk vine, sways, then climbs back up" shape-rendering="crispEdges">
<title>Mario climbs down a beanstalk vine, sways, then climbs back up</title>
<desc>A vine grows down from a used block; Mario rides it to the bottom, swings, and climbs back up.</desc>
